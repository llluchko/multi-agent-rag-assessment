[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["semantic: real local embedding model", "live: real LLM (OpenAI or local Ollama)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
